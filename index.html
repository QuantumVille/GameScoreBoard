<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3 class="board-title" id="board-title-home">HOME</h3>
                <div class="score-container">
                    <span class="score" id="home-score">0</span>
                </div>
                <div class="add-btns-container">
                    <button class="add-btn-container" onClick="addOne('home')">
                        <span class="add-btn-value" >+1</span>
                    </button> 
                    <button class="add-btn-container" onClick="addTwo('home')">
                         <span class="add-btn-value" >+2</span>
                    </button>
                    <button class="add-btn-container" onClick="addThree('home')">
                         <span class="add-btn-value" >+3</span>
                    </button>
                </div>
            </div>
            <div>
                <h3 class="board-title" id="board-title-home">GUEST</h3>
                <div class="score-container">
                    <span class="score" id="away-score">0</span>
                </div>
                <div class="add-btns-container">
                    <button class="add-btn-container" onClick="addOne('away')">
                         <span class="add-btn-value" >+1</span>
                    </button> 
                    <button class="add-btn-container" onClick="addTwo('away')">
                         <span class="add-btn-value"  >+2</span>
                    </button>
                    <button class="add-btn-container" onClick="addThree('away')">
                         <span class="add-btn-value"  >+3</span>
                    </button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
